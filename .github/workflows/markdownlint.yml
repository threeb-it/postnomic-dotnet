name: Markdownlint

permissions:
  contents: read

# run even on changes without markdown changes, so that we can
# make it in GitHub a required check for PR's
on:
  pull_request:

jobs:
  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        # 20 LTS, not 16. markdownlint-cli's dependency chain now uses the
        # regexp `v` flag, which Node 16 cannot parse — so the job died with
        # "SyntaxError: Invalid regular expression flags" before linting a
        # single file. It had been failing on every PR since, unrelated to
        # whatever the PR changed.
        node-version: 20.x
    - name: Run Markdownlint
      run: |
        echo "::add-matcher::.github/workflows/markdownlint-problem-matcher.json"
        # Pinned. An unpinned global install is what turned an upstream
        # release into a red check on branches that never touched markdown.
        npm i -g markdownlint-cli@0.45.0
        markdownlint --ignore '.dotnet/' '**/*.md'
